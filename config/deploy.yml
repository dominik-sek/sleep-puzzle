# Name of your application. Used to uniquely configure containers.
service: sleep_puzzle

# Name of the container image (use your-user/app-name on external registries).
image: gothic459/sleep-puzzle

# Deploy to these servers.
servers:
  web:
    - 146.59.57.68
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Cloudflare sits in front of this host, so Let's Encrypt is not an option: the
# ACME HTTP challenge needs port 80 to reach the origin, and behind an orange-cloud
# record it never does. kamal-proxy terminates TLS with the Cloudflare origin
# certificate instead, which only Cloudflare will ever present a valid chain for.
# Set the zone's SSL/TLS mode to "Full (strict)" so the CF-to-origin hop is
# verified rather than merely encrypted.
proxy:
  # kamal-proxy answers only to the hosts named here -- any other SNI gets a TLS
  # alert, which Cloudflare surfaces as a 525 rather than anything app-shaped.
  # `sleep-puzzle.` is deliberately absent: that name belongs to Render staging.
  hosts:
    - sleeppuzzle.com
    - www.sleeppuzzle.com
  # PEM bodies, not paths: Kamal reads these two names out of .kamal/secrets and
  # uploads the contents to the proxy container itself.
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT
    private_key_pem: CLOUDFLARE_ORIGIN_KEY
  # kamal-proxy stops passing X-Forwarded-* through once ssl is on. Cloudflare is
  # the only thing that can reach the origin, so its headers are trustworthy --
  # and without them every request arrives from the proxy's own IP, which collapses
  # the `rate_limit` buckets in ContactsController onto a single shared counter.
  forward_headers: true

# Docker Hub (the default when no server is given). The repository must be created
# as private first -- Hub defaults new repositories to public, and this image
# carries the compiled app.
registry:
  username: gothic459
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  # Each name here has to exist in .kamal/secrets too, which greps it out of
  # .env.production. Missing from either file and it silently doesn't ship.
  secret:
    - SECRET_KEY_BASE
    - DATABASE_PASSWORD
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_CALENDAR_ID
    - PADDLE_BILLING_ENVIRONMENT
    - PADDLE_BILLING_API_KEY
    - PADDLE_BILLING_CLIENT_TOKEN
    - PADDLE_BILLING_SIGNING_SECRET
    - MAIL_FROM
    - OWNER_EMAIL
    - SMTP_ADDRESS
    - SMTP_PORT
    - SMTP_USER_NAME
    - SMTP_PASSWORD
    - BREVO_API_KEY
    - BREVO_LIST_ID
    - BREVO_DOI_TEMPLATE_ID
    - TURNSTILE_SITE_KEY
    - TURNSTILE_SECRET
    - BUNNY_CDN_HOST
    - BUNNY_CDN_TOKEN
    - BUNNY_STORAGE_ZONE
    - BUNNY_STORAGE_PASSWORD
    - BUNNY_STORAGE_HOST
    - SENTRY_DSN
    - SENTRY_TRACES_SAMPLE_RATE
  clear:
    # Postgres runs as the `db` accessory below, on the same host. Kamal puts both
    # containers on its own docker network, where the accessory answers to
    # <service>-<accessory>, so nothing crosses the public interface.
    DATABASE_HOST: sleep_puzzle-db
    DATABASE_USERNAME: sleep_puzzle
    DATABASE_NAME: sleep_puzzle_production
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set here rather than pulled from .env.production, which says "staging" --
    # that file is shared with the local production-mode boot, and a staging tag
    # on real errors means Sentry files them under the wrong environment.
    SENTRY_ENVIRONMENT: production

    # Mailer link host. Not pulled from .env.production, whose APP_HOST is the
    # Render staging name -- booking mail would link customers at staging.
    #
    # Also the canonical host for OAuth: config/initializers/omniauth.rb pins
    # redirect_uri to https://APP_HOST/users/auth/google_oauth2/callback rather
    # than trusting the request header, so this exact name has to be an
    # authorised redirect URI in the Google console. Changing it here without
    # changing it there breaks Google sign-in with redirect_uri_mismatch.
    # One canonical name only -- alternate domains redirect at Cloudflare's edge
    # and never reach this app.
    APP_HOST: sleeppuzzle.com

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use sleep_puzzle-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "sleep_puzzle_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # Build on the VPS rather than this Mac. The target is amd64 and every developer
  # machine here is arm64, so a local build runs the whole bundle install and asset
  # pipeline under QEMU. Building on the server is native, and it means no Docker
  # daemon is needed locally at all -- only the buildx CLI plugin.
  remote: ssh://ubuntu@146.59.57.68

  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.5
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# OVH's Debian images disable root login and give you `debian` as the sudo user.
# Kamal still bootstraps Docker itself as long as this user has *passwordless*
# sudo -- it probes with `sudo -n`, which fails outright against a password prompt.
ssh:
  user: ubuntu

# Use accessory services (secrets come from .kamal/secrets).
#
# Postgres lives on the same host as the app. The solid_cache/solid_queue/solid_cable
# databases make every cache read and job poll a SQL round trip, which is cheap over
# the local docker network and expensive to a managed database elsewhere.
accessories:
  db:
    image: postgres:17
    # Same machine as the web server above.
    host: 146.59.57.68
    # Bound to loopback, so 5432 is reachable for psql and pg_dump over SSH but
    # never from the internet. The app container doesn't use this mapping at all;
    # it reaches Postgres by container name on the kamal network.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: sleep_puzzle
        POSTGRES_DB: sleep_puzzle_production
      secret:
        - POSTGRES_PASSWORD
    # Bind mount on the host, so `kamal accessory reboot db` and image upgrades
    # don't take the data with them. Back this up off-server; see docs/deploying.md.
    directories:
      - data:/var/lib/postgresql/data
