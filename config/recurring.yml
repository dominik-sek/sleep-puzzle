# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  release_abandoned_bookings:
    class: ReleaseAbandonedBookingsJob
    schedule: every 15 minutes
  # Direct uploads create the blob before the form is submitted, so an admin who
  # picks a file and then closes the tab leaves a full-size recording on disk
  # attached to nothing. Two days, so a form left open overnight still saves.
  purge_unattached_blobs:
    command: "ActiveStorage::Blob.unattached.where(created_at: ..2.days.ago).find_each(&:purge_later)"
    schedule: at 4am every day
