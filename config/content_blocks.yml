      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Regulamin współpracy"
            en: "Terms of cooperation"
    clauses:
      label: Punkty regulaminu
      # a collection rather than a fixed set of fields: the owner has to be able
      # to add and drop clauses without a deploy, and nothing on the page reads
      # any single one of them by name
      collection:
        item_label: Punkt
        fields:
          heading:
            label: Nagłówek
            type: plain
          body:
            label: Treść
            type: plain
        defaults:
          - heading:
              pl: "1. Postanowienia ogólne"
              en: "1. General provisions"
            body:
              pl: "Niniejszy regulamin określa zasady korzystania z konsultacji, pakietów wsparcia oraz materiałów audio dostępnych w ramach Sleep Puzzle."
              en: "These terms set out the rules for using consultations, support packages and audio materials available through Sleep Puzzle."
          - heading:
              pl: "2. Zakres usług"
              en: "2. Scope of services"
            body:
              pl: "Usługi obejmują konsultacje 1:1, pakiety wsparcia (Szybka ulga, Spokojny rytm, System rodziny) oraz sprzedaż audioprocesów i bajek audio dostępnych po zalogowaniu na koncie klienta."
              en: "Services include 1:1 consultations, support packages (Quick Relief, Steady Rhythm, Family System) and the sale of audio processes and audio stories available after logging into a customer account."
          - heading:
              pl: "3. Rezerwacje i płatności"
              en: "3. Bookings and payments"
            body:
              pl: "Rezerwacji terminu konsultacji dokonuje się poprzez kalendarz dostępny na stronie. Płatności za pakiety i produkty audio obsługiwane są przez zewnętrznego operatora płatności Paddle."
              en: "Consultation slots are booked via the calendar on the site. Payments for packages and audio products are handled by the third-party payment provider Paddle."
          - heading:
              pl: "4. Odwołanie i zmiana terminu"
              en: "4. Rescheduling and cancellations"
            body:
              pl: "Zmiana lub odwołanie terminu możliwe jest z odpowiednim wyprzedzeniem — szczegółowe zasady zostaną ustalone indywidualnie przy zawieraniu współpracy."
              en: "Rescheduling or cancelling is possible with reasonable notice — detailed rules are agreed individually when starting cooperation."
          - heading:
              pl: "5. Charakter wsparcia"
              en: "5. Nature of support"
            body:
              pl: "Konsultacje mają charakter wspierający i edukacyjny, nie zastępują konsultacji medycznej. W razie wątpliwości zdrowotnych zalecany jest kontakt z lekarzem pediatrą."
              en: "Consultations are supportive and educational in nature and do not replace medical consultation. For health concerns, please contact a pediatrician."
          - heading:
              pl: "6. Poufność"
              en: "6. Confidentiality"
            body:
              pl: "Wszystkie informacje przekazane w trakcie współpracy są traktowane jako poufne i nie są udostępniane osobom trzecim."
              en: "All information shared during cooperation is treated as confidential and is not shared with third parties."
          # The RODO/GDPR art. 13 information notice. It lives in the CMS like every
          # other clause so the owner can correct it without a deploy — which they
          # must do before launch: the controller's identity below is a placeholder,
          # and nobody but the owner knows what belongs there.
          - heading:
              pl: "7. Dane osobowe"
              en: "7. Personal data"
            body:
              pl: "Administratorem Twoich danych osobowych jest [DO UZUPEŁNIENIA: imię i nazwisko lub nazwa firmy, adres, NIP], kontakt: [DO UZUPEŁNIENIA: adres e-mail].\n\nDane podane przy zakładaniu konta (adres e-mail, imię) przetwarzamy po to, by prowadzić Twoje konto i udostępnić Ci zakupione materiały — podstawą jest wykonanie umowy (art. 6 ust. 1 lit. b RODO). Dane rezerwacji i zamówień przetwarzamy w tym samym celu oraz dla rozliczeń podatkowych, do czego zobowiązuje nas prawo (art. 6 ust. 1 lit. c RODO).\n\nOdbiorcami danych są wyłącznie: Paddle.com Market Ltd — operator płatności i sprzedawca formalny, Google — tylko jeśli sam wybierzesz logowanie kontem Google, oraz dostawca hostingu. Nie sprzedajemy danych, nie przekazujemy ich reklamodawcom i nie budujemy na ich podstawie profili.\n\nMasz prawo dostępu do swoich danych, ich sprostowania, usunięcia, ograniczenia przetwarzania i przeniesienia, a także prawo wniesienia skargi do Prezesa Urzędu Ochrony Danych Osobowych. Konto możesz usunąć w każdej chwili — usuwamy wtedy dane konta poza tym, co musimy zachować dla celów księgowych."
              en: "The controller of your personal data is [TO BE COMPLETED: name or company name, address, tax id], contact: [TO BE COMPLETED: email address].\n\nThe data you give when creating an account (email address, first name) is processed so that we can run your account and give you access to what you bought — the legal basis is performance of the contract (Art. 6(1)(b) GDPR). Booking and order data is processed for the same purpose and for tax records, which the law requires of us (Art. 6(1)(c) GDPR).\n\nThe only recipients are: Paddle.com Market Ltd, our payment provider and merchant of record; Google, but only if you choose to sign in with a Google account; and our hosting provider. We do not sell your data, pass it to advertisers, or build profiles from it.\n\nYou have the right to access, correct, erase, restrict and port your data, and to complain to your data protection authority. You can delete your account at any time — we then remove the account data apart from what we must keep for accounting."
          - heading:
              pl: "8. Pliki cookies"
              en: "8. Cookies"
            body:
              pl: "Nie używamy cookies analitycznych, marketingowych ani śledzących. Nie ma tu Google Analytics, pikseli reklamowych ani żadnego narzędzia, które budowałoby profil odwiedzającego.\n\nZapisujemy jeden własny plik cookie sesyjny, niezbędny do działania serwisu: utrzymuje zalogowanie i zawartość koszyka oraz zabezpiecza formularze przed nadużyciem. Cookie niezbędne do świadczenia usługi, o którą sam poprosiłeś, nie wymaga zgody.\n\nPozostałe pliki pojawiają się tylko w odpowiedzi na Twoje działanie. Gdy przechodzisz do płatności, ładuje się skrypt Paddle, który obsługuje transakcję i wykrywa nadużycia. Gdy wybierasz logowanie kontem Google, cookies ustawia Google na swojej własnej stronie logowania. Dopóki nie zrobisz żadnej z tych dwóch rzeczy, na stronie nie uruchamia się żaden skrypt zewnętrzny.\n\nKroje pisma serwujemy z własnego serwera, więc samo odwiedzenie strony nie wysyła Twojego adresu IP do żadnej firmy trzeciej."
              en: "We use no analytics, marketing or tracking cookies. There is no Google Analytics here, no advertising pixels, and nothing that builds a profile of a visitor.\n\nWe store one session cookie of our own, which the site needs in order to work: it keeps you signed in, holds your basket, and protects forms against abuse. A cookie strictly necessary for a service you asked for does not require consent.\n\nAnything beyond that appears only in response to something you do. When you go through to payment, the Paddle script loads to handle the transaction and detect fraud. When you choose to sign in with Google, Google sets cookies on its own sign-in page. Until you do one of those two things, no third-party script runs on the site at all.\n\nWe serve our typefaces from our own server, so simply visiting the site sends your IP address to no third party."
