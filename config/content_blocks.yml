            en: "To fulfil purchases and handle refunds and complaints, we record consent text and dates, the purchase language and terms, email delivery confirmation, booking changes and Paddle adjustments, and the first audio stream issuance and playback reported by the browser. Playback records support individual review; they do not automatically reject refunds or complaints."
