# The editable content of the public site, as pages > sections > fields.
#
# This file is the source of truth: `bin/rails content_blocks:sync` creates a row
# for every field declared here. Nothing in the admin panel can invent a key,
# because a typo in a key silently blanks a section of the site.
#
# field type:
#   plain - a short string, rendered as-is into the template (titles, subtitles)
#   rich  - Action Text, with a Trix editor and formatting (paragraphs, links)
#   image - an uploaded picture, one file per key rather than one per language.
#           Has no `default`: until something is uploaded the template decides
#           what an empty slot looks like.
#
# default:
#   The copy the page ships with. Used whenever the database has nothing for a
#   field — including a fresh deploy, before anything has been seeded or edited —
#   so the site never renders a blank section. Editing a block in the admin panel
#   overrides it. `en` may be omitted: it falls back to `pl`.
#
#   For rich fields the default is HTML, and it is trusted: it comes from this
#   file, not from user input.
#
# collection:
#   A section may also hold a repeating list the owner can add to and remove from
#   (process steps, stats). Items carry only plain short strings, and their
#   `defaults` seed the list when the database has none.
