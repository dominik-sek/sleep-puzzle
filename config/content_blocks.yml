          type: plain
          default:
            pl: "Termin został zwolniony. Rozliczenie płatności jest obsługiwane osobno."
            en: "The appointment has been released. Payment settlement is handled separately."
        change_subject:
          label: "Temat wiadomości o zmianie"
          type: plain
          default:
            pl: "Zmiana rezerwacji — Sleep Puzzle"
            en: "Your booking has changed — Sleep Puzzle"
        no_early_consent:
          label: "Brak zgody na wcześniejsze rozpoczęcie"
          type: plain
          default:
            pl: "Nie udzielono zgody na rozpoczęcie świadczenia przed upływem 14 dni."
            en: "No consent was given to begin performance before the 14-day period ends."
        booking_status:
          label: "Etykieta stanu rezerwacji"
