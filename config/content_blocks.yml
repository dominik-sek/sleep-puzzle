          type: rich
          default:
            pl: "<div>Nazywam się Karola – ta, co układa sen rodzin jak puzzle. Kawałek po kawałku pomagam odzyskać spokojne noce, równowagę i czas dla siebie, partnera i dziecka.</div>"
            en: "<div>My name is Karola - the one who pieces family sleep together like a puzzle. Piece by piece, I help you get calm nights back - and time for yourself, your partner and your child.</div>"
        body:
          label: Treść przed cytatem
          type: rich
          default:
            pl: "<div>Wierzę, że zdrowy sen zaczyna się od empatii, wsparcia i emocjonalnie zaopiekowanego dorosłego. Dlatego nie działam szablonowo - każda rodzina to inna układanka, inne tempo i inna historia.</div>"
            en: "<div>I believe healthy sleep starts with empathy, support, and an emotionally cared-for adult. That's why I never use a one-size-fits-all approach - every family is a different puzzle, a different pace, a different story.</div>"
        quote:
          label: Cytat
          type: plain
          default:
            pl: "„Piasek jest fajny - na plaży. Nie pod powiekami” :)"
            en: "\"Sand is fun - at the beach. Not under your eyelids\" :)"
        body_after_quote:
          label: Treść po cytacie
          type: rich
          default:
            pl: "<div>Od ponad 20 lat wspieram dzieci i rodziców, łącząc wiedzę o śnie i rozwoju dziecka z uważnością i realną pomocą. Współpracując ze mną, nie tracisz czasu na sprzeczne informacje - masz swoją gadającą encyklopedię pod telefonem.</div>"
            en: "<div>For over 20 years I've supported children and parents, combining sleep and development knowledge with mindfulness and real help. Working with me, you don't waste time on conflicting information - you have your own talking encyclopedia in your pocket.</div>"
