# The editable content of the public site, as pages > sections > fields.
#
# This file is the source of truth: `bin/rails content_blocks:sync` creates a row
# for every field declared here. Nothing in the admin panel can invent a key,
# because a typo in a key silently blanks a section of the site.
#
# field type:
#   plain - a short string, rendered as-is into the template (titles, subtitles)
#   rich  - Action Text, with a Trix editor and formatting (paragraphs, links)
#   image - an uploaded picture, one file per key rather than one per language.
#           Has no `default`: until something is uploaded the template decides
#           what an empty slot looks like.
#
# default:
#   The copy the page ships with. Used whenever the database has nothing for a
#   field - including a fresh deploy, before anything has been seeded or edited -
#   so the site never renders a blank section. Editing a block in the admin panel
#   overrides it. `en` may be omitted: it falls back to `pl`.
#
#   For rich fields the default is HTML, and it is trusted: it comes from this
#   file, not from user input.
#
# collection:
#   A section may also hold a repeating list the owner can add to and remove from
#   (process steps, stats). Items carry only plain short strings, and their
#   `defaults` seed the list when the database has none.
# admin_hidden: true keeps a section or field available for later restoration,
#   while removing its controls from the content editor.
home:
  label: Strona główna
  sections:
    hero:
      label: Sekcja główna
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Układamy sen Twojej rodziny jak puzzle."
        subtitle:
          label: Podtytuł
          type: plain
          default:
            pl: "Kawałek po kawałku pomagam odzyskać spokojne noce, równowagę i czas dla siebie, partnera i dziecka - z empatią, wiedzą i bez presji."
    about:
      label: O mnie
      fields:
        photo:
          label: Zdjęcie
          type: image
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Cześć, jestem Karola"
        lead:
          label: Wstęp
          type: rich
          default:
            pl: "<div>Nazywam się Karola - ta, co układa sen rodzin jak puzzle. Wierzę, że zdrowy sen zaczyna się od empatii, wsparcia i emocjonalnie zaopiekowanego dorosłego.</div>"
        body:
          label: Treść
          admin_hidden: true
          type: rich
          default:
            pl: "<div>Od ponad 20 lat wspieram dzieci i rodziców, łącząc wiedzę o śnie i rozwoju dziecka z uważnością i realną pomocą.</div>"
        cta_label:
          label: Przycisk - tekst
          admin_hidden: true
          type: plain
          default:
            pl: "Poznaj mnie lepiej"
            en: "More about me"
        cta_url:
          label: "Przycisk - adres"
          admin_hidden: true
          type: plain
          default:
            pl: "/about"
    choices:
      label: Dwie ścieżki oferty
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Jak mogę Ci pomóc"
            en: "How can I help you?"
        audio:
          label: Opis audioprocesu
          type: plain
          default:
            pl: "Posłuchaj i pracuj we własnym tempie"
            en: "Listen and work at your own pace"
        one_to_one:
          label: Opis współpracy 1:1
          type: plain
          default:
            pl: "Ułóżmy plan dla Twojej rodziny razem"
            en: "Let's make a plan for your family together"
    methodology:
      label: Metodologia
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Moja metodologia"
            en: "My approach"
        body:
          label: Treść
          type: rich
          default:
            pl: "<div>Każda rodzina ma własny rytm. Zaczynam od zrozumienia Waszej sytuacji, a potem dobieram małe, możliwe do wdrożenia kroki. Łączę wiedzę o śnie i rozwoju dziecka z empatią dla całej rodziny.</div>"
            en: "<div>Every family has its own rhythm. I start by understanding your situation, then choose small, workable steps. I combine knowledge of sleep and child development with empathy for the whole family.</div>"
    disagree:
      label: Z czym się nie zgadzam
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Z czym się nie zgadzam"
            en: "What I don't believe in"
        body:
          label: Treść
          type: rich
          default:
            pl: "<div>Nie wierzę w jeden schemat, który pasuje każdemu dziecku. Nie obiecuję szybkich cudów ani nie dokładam presji rodzicom, którzy już robią bardzo dużo.</div>"
            en: "<div>I don't believe in one routine for every child. I don't promise instant miracles or add pressure to parents who are already doing so much.</div>"
    stats:
      label: Liczby
      admin_hidden: true
      collection:
        item_label: Liczba
        fields:
