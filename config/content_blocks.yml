            label: Treść
            type: plain
        defaults:
          - text:
              pl: "20+ lat"
    process:
      label: Jak wygląda współpraca
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Jak wygląda współpraca"
      collection:
        item_label: Krok
        fields:
          title:
            label: Nagłówek
            type: plain
          body:
            label: Opis
            type: plain
        defaults:
          - title:
              pl: "Krok pierwszy"
            body:
              pl: "Opis kroku"
          - title:
              pl: "Krok drugi"
            body:
              pl: "Opis kroku"
          - title:
              pl: "Krok trzeci"
            body:
              pl: "Opis kroku"
    packages:
      label: Pakiety współpracy
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Pakiety współpracy"
        subtitle:
          label: Podtytuł
          type: plain
          default:
            pl: "Od szybkiej ulgi po pełne poukładanie rodzinnego systemu — Ty wybierasz tempo."
    audio:
      label: Audioprocesy i bajki
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Audioprocesy i bajki na dobranoc"
        body:
