      fields:
        audio_consent:
          label: "Zgoda audio"
          type: plain
          default:
            pl: "Wyrażam zgodę na rozpoczęcie dostarczania zakupionych treści audio przed upływem 14 dni. Przyjmuję do wiadomości, że wraz z rozpoczęciem dostarczania utracę ustawowe prawo do odstąpienia od umowy, po spełnieniu warunków przewidzianych prawem, w tym otrzymaniu potwierdzenia zakupu i zgody."
            en: "I consent to delivery of the purchased audio content starting before the 14-day period ends. I acknowledge that I will lose the statutory right of withdrawal when delivery starts, once the conditions prescribed by law are met, including receipt of confirmation of the purchase and consent."
        booking_consent:
          label: "Zgoda konsultacje"
          type: plain
          default:
            pl: "Żądam rozpoczęcia uzgodnionej usługi, w tym przygotowania i wsparcia, przed upływem 14 dni. Przyjmuję do wiadomości, że po pełnym wykonaniu usługi utracę prawo do odstąpienia od umowy."
            en: "I expressly request that the agreed service, including preparation and support, starts before the 14-day period ends. I acknowledge that after full performance I will lose the right of withdrawal."
        booking_hint:
          label: "Wskazówka"
          type: plain
          default:
            pl: "Zgoda jest potrzebna, jeśli spotkanie lub płatna praca mają rozpocząć się w ciągu pierwszych 14 dni. Bez zgody wybierz późniejszy termin."
            en: "Consent is needed if the appointment or paid work is to start within the first 14 days. Without consent, choose a later appointment."
        confirmation_subject:
