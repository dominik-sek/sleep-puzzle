            pl: "/about"
    choices:
      label: Dwie ścieżki oferty
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Jak mogę Ci pomóc"
            en: "How can I help you?"
        audio:
          label: Opis audioprocesu
          type: plain
          default:
            pl: "Posłuchaj i pracuj we własnym tempie"
            en: "Listen and work at your own pace"
        one_to_one:
          label: Opis współpracy 1:1
          type: plain
          default:
            pl: "Ułóżmy plan dla Twojej rodziny razem"
            en: "Let's make a plan for your family together"
    methodology:
      label: Metodologia
      fields:
        title:
          label: Nagłówek
          type: plain
          default:
            pl: "Moja metodologia"
            en: "My approach"
        body:
          label: Treść
          type: rich
          default:
            pl: "<div>Każda rodzina ma własny rytm. Zaczynam od zrozumienia Waszej sytuacji, a potem dobieram małe, możliwe do wdrożenia kroki. Łączę wiedzę o śnie i rozwoju dziecka z empatią dla całej rodziny.</div>"
            en: "<div>Every family has its own rhythm. I start by understanding your situation, then choose small, workable steps. I combine knowledge of sleep and child development with empathy for the whole family.</div>"
    disagree:
      label: Z czym się nie zgadzam
      fields:
        title:
