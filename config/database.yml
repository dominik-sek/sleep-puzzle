# PostgreSQL. Versions 9.5 and up are supported.
#
# Every connection value comes from the environment (`.env` locally, real env
# vars in production) so no credential is ever committed. The defaults below are
# only the database names, which are not secrets.
#
# If DATABASE_URL is set it wins: Rails merges it on top of whatever is here,
# which is how CI points the suite at its own postgres service and how the Render
# staging environment is configured.
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  # Left blank, PostgreSQL falls back to the OS user running Rails and to no
  # password, which is the usual peer-authenticated local setup.
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "sleep_puzzle_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "sleep_puzzle_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "sleep_puzzle_production") %>
