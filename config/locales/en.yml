# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  activemodel:
    attributes:
      contact_message:
        name: "Full name"
        email: "Email address"
        body: "Message"
    errors:
      models:
        contact_message:
          attributes:
            name:
              blank: "Please give your name"
            email:
              blank: "Please give an email address"
              invalid: "Please give a valid email address"
            body:
              blank: "Please write a message"
  contact_mailer:
    details:
      name: "Full name"
      email: "Email"
    new_message:
      subject: "Message from the contact form: %{name}"
      heading: "New message from the contact form"
  contacts:
    rate_limited: "Too many messages sent. Please try again in a moment."
    turnstile_failed: "We could not confirm you are not a robot. Please try again."
  packages:
    duration:
      one: "Support lasts %{count} week"
      other: "Support lasts %{count} weeks"
  products:
    length_minutes:
      one: "%{count} min"
      other: "%{count} min"
  pagination:
    showing: "Showing"
    of: "of"
    page: "Page"
    jump_to_page: "Jump to page"
    go: "Go"
    rows: "Rows"
