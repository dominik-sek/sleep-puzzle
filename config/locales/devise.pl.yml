# Polish counterpart to devise.en.yml. Devise ships English only, so without this
# every flash, every failure message and every mail subject in the sign-in flow
# arrives in English on a Polish site.
pl:
  devise:
    confirmations:
      confirmed: "Twój adres e-mail został potwierdzony."
      send_instructions: "Za kilka minut otrzymasz e-mail z instrukcją potwierdzenia adresu."
      send_paranoid_instructions: "Jeśli Twój adres jest w naszej bazie, za kilka minut otrzymasz e-mail z instrukcją potwierdzenia."
    failure:
      already_authenticated: "Jesteś już zalogowana."
      inactive: "Twoje konto nie zostało jeszcze aktywowane."
      invalid: "Nieprawidłowy %{authentication_keys} lub hasło."
      locked: "Twoje konto jest zablokowane."
      last_attempt: "Masz jeszcze jedną próbę, zanim konto zostanie zablokowane."
      not_found_in_database: "Nieprawidłowy %{authentication_keys} lub hasło."
      timeout: "Sesja wygasła. Zaloguj się ponownie, aby kontynuować."
      unauthenticated: "Zaloguj się lub załóż konto, aby kontynuować — wrócisz do tego samego miejsca."
      unconfirmed: "Potwierdź swój adres e-mail, aby kontynuować."
    mailer:
      confirmation_instructions:
        subject: "Potwierdź swój adres e-mail"
      reset_password_instructions:
        subject: "Ustaw nowe hasło"
      unlock_instructions:
        subject: "Odblokuj konto"
      email_changed:
        subject: "Adres e-mail został zmieniony"
      password_change:
        subject: "Hasło zostało zmienione"
    omniauth_callbacks:
      failure: "Nie udało się zalogować przez %{kind}: %{reason}."
      success: "Zalogowano przez %{kind}."
    passwords:
      no_token: "Ta strona jest dostępna tylko z linku w e-mailu o zmianie hasła. Sprawdź, czy adres jest kompletny."
      send_instructions: "Za kilka minut otrzymasz e-mail z instrukcją ustawienia nowego hasła."
      send_paranoid_instructions: "Jeśli Twój adres jest w naszej bazie, za kilka minut otrzymasz e-mail z linkiem do ustawienia nowego hasła."
      updated: "Hasło zostało zmienione. Jesteś zalogowana."
      updated_not_active: "Hasło zostało zmienione."
    registrations:
      destroyed: "Konto zostało usunięte. Mamy nadzieję, że jeszcze się zobaczymy."
      signed_up: "Konto zostało założone. Witamy!"
      signed_up_but_inactive: "Konto zostało założone, ale nie możesz się jeszcze zalogować — nie jest aktywne."
      signed_up_but_locked: "Konto zostało założone, ale nie możesz się zalogować — jest zablokowane."
      signed_up_but_unconfirmed: "Wysłaliśmy link potwierdzający na Twój adres. Otwórz go, aby aktywować konto."
      update_needs_confirmation: "Dane zostały zapisane. Potwierdź nowy adres, klikając link, który na niego wysłaliśmy."
      updated: "Dane konta zostały zapisane."
      updated_but_not_signed_in: "Dane konta zostały zapisane, ale ze względu na zmianę hasła zaloguj się ponownie."
    sessions:
      signed_in: "Zalogowano."
      signed_out: "Wylogowano."
      already_signed_out: "Wylogowano."
    unlocks:
      send_instructions: "Za kilka minut otrzymasz e-mail z instrukcją odblokowania konta."
      send_paranoid_instructions: "Jeśli Twoje konto istnieje, za kilka minut otrzymasz e-mail z instrukcją odblokowania."
      unlocked: "Konto zostało odblokowane. Zaloguj się, aby kontynuować."
  errors:
    messages:
      already_confirmed: "był już potwierdzony, spróbuj się zalogować"
      confirmation_period_expired: "musi zostać potwierdzony w ciągu %{period}, poproś o nowy link"
      expired: "wygasł, poproś o nowy"
      not_found: "nie został znaleziony"
      not_locked: "nie był zablokowany"
      not_saved:
        one: "Nie udało się zapisać — jeden błąd:"
        few: "Nie udało się zapisać — %{count} błędy:"
        many: "Nie udało się zapisać — %{count} błędów:"
        other: "Nie udało się zapisać — %{count} błędu:"
