pl:
  activerecord:
    # Package and Product name is a translated value, not a column, so the label
    # says which language is missing — rails-i18n supplies the "nie może być
    # puste" half.
    attributes:
      package:
        name: "Nazwa (polski)"
      product:
        name: "Nazwa (polski)"
    errors:
      models:
        package:
          attributes:
            name:
              blank: "nie może być pusta"
        product:
          attributes:
            name:
              blank: "nie może być pusta"
        booking:
          attributes:
            name:
              blank: "Podaj imię i nazwisko"
            email:
              blank: "Podaj adres email"
              invalid: "Podaj prawidłowy adres email"
            package:
              required: "Wybierz pakiet"
  booking_mailer:
    details:
      package: "Pakiet"
      starts_at: "Termin"
      status: "Status płatności"
      name: "Imię i nazwisko"
      email: "Email"
    confirmed:
      subject: "Rezerwacja potwierdzona"
      heading: "Rezerwacja potwierdzona"
      intro: "Dziękujemy! Płatność została zaksięgowana, a Twój termin jest zarezerwowany."
      cta: "Zobacz szczegóły rezerwacji"
      outro: "Gdyby coś się zmieniło, po prostu odpisz na tę wiadomość."
    new_booking:
      subject: "Nowa opłacona rezerwacja: %{name}"
      heading: "Nowa opłacona rezerwacja"
      intro: "Konsultacja została opłacona i dodana do kalendarza."
    payment_failed:
      subject: "Płatność nie powiodła się"
      heading: "Płatność nie powiodła się"
      intro: "Nie udało się zaksięgować płatności, więc zwolniliśmy zarezerwowany termin. Możesz spróbować ponownie."
      cta: "Wybierz nowy termin"
  bookings:
    available_slots:
      one: "%{count} termin dostępny"
      few: "%{count} terminy dostępne"
      many: "%{count} terminów dostępnych"
      other: "%{count} terminu dostępnego"
  packages:
    duration:
      one: "Czas trwania wsparcia: %{count} tydzień"
      few: "Czas trwania wsparcia: %{count} tygodnie"
      many: "Czas trwania wsparcia: %{count} tygodni"
      other: "Czas trwania wsparcia: %{count} tygodnia"
  pagination:
    showing: "Wyświetlono"
    of: "z"
    page: "Strona"
    jump_to_page: "Przejdź do strony"
    go: "Idź"
    rows: "Wierszy"
