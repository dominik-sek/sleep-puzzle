version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Respect Gemfile constraints rather than rewriting them for newer versions.
  versioning-strategy: lockfile-only
  # Upgrade this tested payment pair manually, including production asset checks.
  ignore:
  - dependency-name: pay
  - dependency-name: paddle
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
